name: _woa-verify

# After Kitmaker publishes, install one cell's wheels back from pypi.nvidia.com on WoA
# hardware: download exactly the released filenames, check them against the SHA-256
# that index-check verified, install them into a clean venv, and run a CUDA smoke
# test. This is what a user does, on the hardware a user has.
#
# index-check has already proven, on a GitHub-hosted runner, that the index's copy of
# every wheel is what the release's attestations vouch for. Nothing installs unless its
# bytes match those hashes, which arrive as job outputs rather than artifacts any job in
# the run could replace. This adds the install and the GPU, which only the WoA runner
# pool can provide.
#
# Runner egress needed: pypi.nvidia.com (public) and pypi.org for dependencies.

on:
  workflow_call:
    inputs:
      runner-base:
        description: "Runner label for the WoA pool."
        type: string
        required: false
        default: "woa-arm64"
      python-version:
        description: "Dotted Python version of the cell."
        type: string
        required: true
      python-label:
        description: "Python label of the cell."
        type: string
        required: true
      channel:
        description: "nightly | release - selects the index the wheels were published to."
        type: string
        required: true
      cell-files:
        description: "JSON {path: sha256} of the cell's build artifact, from the resolve job; its wheels are the filenames to expect."
        type: string
        required: true
      published-wheels:
        description: "JSON {filename: sha256} of every published wheel, as index-check verified it."
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on:
      - ${{ inputs.runner-base }}
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      WOA_CUDA_PATH: 'C:\Program Files\NVIDIA\CUDA\v13.4'
      WOA_CUDNN_ROOT: 'C:\Program Files\NVIDIA\CUDNN\v9.26'
      PT_ROOT: 'C:\pt'
      WOA_SCRATCH: 'C:\ci\woa\scratch'
      WOA_VENV_DIR: 'C:\ci\woa\scratch\venv'
      PIP_CACHE_DIR: 'C:\ci\woa\scratch\pipcache'
    steps:
      - name: Checkout OOT tooling repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: oot
          show-progress: false
          persist-credentials: false

      # The workspace root survives between jobs on these persistent runners.
      - name: Strict clean (pre)
        uses: ./oot/.github/actions/woa-strict-clean
        with:
          phase: pre
          pt-root: ${{ env.PT_ROOT }}
          scratch-root: ${{ env.WOA_SCRATCH }}
          extra-paths: |
            ${{ github.workspace }}/verify

      - name: Preflight test toolchain + GPU
        uses: ./oot/.github/actions/woa-preflight-test
        with:
          python-version: ${{ inputs.python-version }}
          python-label: ${{ inputs.python-label }}
          cuda-path: ${{ env.WOA_CUDA_PATH }}
          cudnn-root: ${{ env.WOA_CUDNN_ROOT }}

      - name: Create job venv
        id: venv
        uses: ./oot/.github/actions/woa-create-venv
        with:
          role: test
          python-version: ${{ inputs.python-version }}
          python-label: ${{ inputs.python-label }}
          venv-path: ${{ env.WOA_VENV_DIR }}\verify-${{ inputs.python-label }}

      # The hashes come from what was published, not from this cell's build: a wheel several
      # cells build (abi3 or py3-none) is published from one cell only, so the others' own
      # copies differ.
      - name: Install the released wheels from pypi.nvidia.com
        env:
          INDEX_URL: ${{ inputs.channel == 'release' && 'https://pypi.nvidia.com/nvtorch_oot' || 'https://pypi.nvidia.com/nvtorch_oot_nightly' }}
          VENV_ACTIVATE: ${{ steps.venv.outputs.venv-activate }}
          CELL: ${{ inputs.python-label }}
          CELL_FILES: ${{ inputs.cell-files }}
          PUBLISHED_WHEELS: ${{ inputs.published-wheels }}
        run: |
          $published = @{}
          ($env:PUBLISHED_WHEELS | ConvertFrom-Json).PSObject.Properties | ForEach-Object { $published[$_.Name] = $_.Value }
          $names = @(($env:CELL_FILES | ConvertFrom-Json).PSObject.Properties.Name | Where-Object { $_ -like '*.whl' } | Sort-Object)
          if ($names.Count -eq 0) { throw "the $env:CELL build handed on no wheels" }
          $hashes = [ordered]@{}
          foreach ($name in $names) {
            if (-not $published.ContainsKey($name)) { throw "$name was built for $env:CELL but index-check did not verify it" }
            $hashes[$name] = $published[$name]
          }
          $python = Join-Path (Split-Path -Parent $env:VENV_ACTIVATE) 'python.exe'
          ./oot/tools/woa-build/shared/publish/Test-PyPiWheelRelease.ps1 `
            -WheelFileName $names -PythonExecutable $python -IndexUrl $env:INDEX_URL `
            -ExpectedHashesJson ($hashes | ConvertTo-Json -Compress) `
            -ReportPath "verify/pypi-verification-$env:CELL.json" | Out-Null

      - name: Upload verification report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: woa-${{ inputs.python-label }}-cu134-pypi-verification-${{ github.run_id }}
          path: verify
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

      - name: Strict clean (post)
        if: always()
        uses: ./oot/.github/actions/woa-strict-clean
        with:
          phase: post
          pt-root: ${{ env.PT_ROOT }}
          scratch-root: ${{ env.WOA_SCRATCH }}
          extra-paths: |
            ${{ github.workspace }}/verify
